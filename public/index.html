<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Recovery Credit — Connecting</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c2340;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #111e33;
      border: 1px solid #1f3252;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      border-top-color: #10b981;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }
    p.desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .status-text {
      font-size: 11px;
      font-family: monospace;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-bottom: 14px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #071324;
      border: 1px solid #283e63;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }
    input:focus {
      border-color: #10b981;
    }
    .btn-submit {
      width: 100%;
      padding: 12px 0;
      background: #15803d;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-submit:active {
      background: #166534;
    }
    .preset-chips {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      text-align: left;
    }
    .chip {
      background: #172844;
      border: 1px solid #273e66;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chip:hover {
      background: #20355a;
      border-color: #3b5a8f;
      color: #ffffff;
    }
    .chip span.badge {
      font-size: 9px;
      padding: 2px 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-radius: 4px;
      font-weight: 600;
    }
    .tip {
      font-size: 10.5px;
      color: #64748b;
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1>Recovery Credit</h1>
    <p class="desc" id="subDesc">Connecting to backend server...</p>

    <div class="status-text" id="statusBox">Detecting host server...</div>

    <div id="manualControls" style="display: none;">
      <div class="preset-chips">
        <label>Recommended Connection Presets:</label>
        <div class="chip" onclick="applyPreset('http://10.0.2.2:3000')">
          <span>http://10.0.2.2:3000</span>
          <span class="badge">LDPlayer / Emulator</span>
        </div>
        <div class="chip" onclick="applyPreset('http://192.168.1.189:3000')">
          <span>http://192.168.1.189:3000</span>
          <span class="badge">Wi-Fi LAN IP</span>
        </div>
      </div>

      <div class="input-group">
        <label>Server Endpoint URL</label>
        <input type="text" id="serverInput" value="http://10.0.2.2:3000" placeholder="http://10.0.2.2:3000">
      </div>

      <button class="btn-submit" onclick="testAndConnect()">Connect Now</button>

      <p class="tip">
        Make sure the Next.js server is running on your PC:
        <br><code style="color: #38bdf8;">npm run dev</code>
      </p>
    </div>
  </div>

  <script>
    const candidates = [
      localStorage.getItem('rc_server_url'),
      'http://10.0.2.2:3000',
      'http://192.168.1.189:3000',
      'http://localhost:3000'
    ].filter(Boolean);

    let found = false;

    async function pingUrl(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1800);
        await fetch(url + '/favicon.ico', {
          method: 'HEAD',
          mode: 'no-cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function autoConnect() {
      const statusBox = document.getElementById('statusBox');

      for (const url of candidates) {
        statusBox.textContent = 'Testing ' + url + '...';
        const ok = await pingUrl(url);
        if (ok) {
          found = true;
          statusBox.textContent = 'Connected! Loading application...';
          localStorage.setItem('rc_server_url', url);
          setTimeout(() => {
            window.location.replace(url + '/login');
          }, 300);
          return;
        }
      }

      // If all automatic pings fail, show manual configuration
      showManualControls();
    }

    function showManualControls() {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('subDesc').textContent = 'Server not detected. Please verify your server connection:';
      document.getElementById('statusBox').textContent = 'Offline / Waiting for Next.js server';
      document.getElementById('manualControls').style.display = 'block';

      const saved = localStorage.getItem('rc_server_url');
      if (saved) {
        document.getElementById('serverInput').value = saved;
      }
    }

    function applyPreset(url) {
      document.getElementById('serverInput').value = url;
      testAndConnect();
    }

    async function testAndConnect() {
      const input = document.getElementById('serverInput');
      const url = input.value.trim().replace(/\/$/, '');
      if (!url) return;

      const statusBox = document.getElementById('statusBox');
      statusBox.textContent = 'Testing ' + url + '...';
      document.getElementById('spinner').style.display = 'block';

      const ok = await pingUrl(url);
      if (ok) {
        statusBox.textContent = 'Connected! Loading application...';
        localStorage.setItem('rc_server_url', url);
        setTimeout(() => {
          window.location.replace(url + '/login');
        }, 300);
      } else {
        document.getElementById('spinner').style.display = 'none';
        statusBox.textContent = 'Could not reach ' + url + '. Verify server is running.';
        alert('Cannot reach ' + url + '\n\nPlease ensure your PC dev server is running with:\nnpm run dev');
      }
    }

    // Start auto connect on load
    autoConnect();
  </script>
</body>
</html>
